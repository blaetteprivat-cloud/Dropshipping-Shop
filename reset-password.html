<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passwort zurücksetzen — NovaShop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239c7a52'/%3E%3Cstop offset='1' stop-color='%23c2a06c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ctext x='12' y='16.5' font-family='sans-serif' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="5,13 10,18 19,7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13,6 19,12 13,18"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 20c-7 0-11-8-11-8a19.6 19.6 0 0 1 5.06-6.06M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
  </defs>
</svg>

<header class="navbar">
  <div class="container navbar__inner">
    <a class="brand" href="index.html" aria-label="NovaShop Startseite">
      <span class="brand__mark" aria-hidden="true">N</span>
      NovaShop
    </a>
    <div class="navbar__actions">
      <a class="btn btn-ghost" href="index.html">Zur Website</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="admin-login">
    <div class="container">
      <div class="admin-login__card glass-strong">
        <div class="admin-login__icon" id="reset-icon">
          <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-lock"></use></svg>
        </div>
        <h1 id="reset-heading">Neues Passwort vergeben</h1>
        <p class="auth-form__sub" id="reset-message">Bitte gib dein neues Passwort ein.</p>

        <form id="reset-form" class="auth-form" novalidate>
          <label for="reset-password">Neues Passwort
            <span class="password-field">
              <input type="password" id="reset-password" name="password" required autocomplete="new-password" minlength="6" placeholder="Mind. 6 Zeichen">
              <button type="button" class="password-toggle" aria-pressed="false" aria-label="Passwort anzeigen" data-password-toggle="reset-password">
                <svg class="icon icon-sm icon-eye" aria-hidden="true"><use href="#icon-eye"></use></svg>
                <svg class="icon icon-sm icon-eye-off" aria-hidden="true"><use href="#icon-eye-off"></use></svg>
              </button>
            </span>
          </label>
          <label for="reset-password-confirm">Passwort bestätigen
            <span class="password-field">
              <input type="password" id="reset-password-confirm" name="passwordConfirm" required autocomplete="new-password" placeholder="Passwort wiederholen">
              <button type="button" class="password-toggle" aria-pressed="false" aria-label="Passwort anzeigen" data-password-toggle="reset-password-confirm">
                <svg class="icon icon-sm icon-eye" aria-hidden="true"><use href="#icon-eye"></use></svg>
                <svg class="icon icon-sm icon-eye-off" aria-hidden="true"><use href="#icon-eye-off"></use></svg>
              </button>
            </span>
          </label>
          <p class="form-error" id="reset-error" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit" id="reset-submit">Passwort speichern</button>
        </form>

        <a class="btn btn-primary btn-block" id="reset-cta" href="shop.html" hidden>
          Weiter einkaufen
          <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
        </a>
      </div>
    </div>
  </section>
</main>

<script src="js/capacitor-bridge.js"></script>
<script src="js/connectivity.js"></script>
<script src="js/auth.js"></script>
<script src="js/cookie-consent.js"></script>
<script>
(function () {
  "use strict";
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email") || "";
  const token = params.get("token") || "";

  const iconEl = document.getElementById("reset-icon");
  const headingEl = document.getElementById("reset-heading");
  const messageEl = document.getElementById("reset-message");
  const form = document.getElementById("reset-form");
  const errorEl = document.getElementById("reset-error");
  const ctaEl = document.getElementById("reset-cta");

  document.querySelectorAll("[data-password-toggle]").forEach((toggle) => {
    toggle.addEventListener("click", () => {
      const input = document.getElementById(toggle.getAttribute("data-password-toggle"));
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "Passwort verbergen" : "Passwort anzeigen");
    });
  });

  function setSuccessState(name) {
    iconEl.innerHTML = '<svg class="icon icon-lg" aria-hidden="true"><use href="#icon-check"></use></svg>';
    headingEl.textContent = "Passwort geändert!";
    messageEl.textContent = "Dein neues Passwort wurde gespeichert" + (name ? ", " + name : "") + ". Du bist jetzt angemeldet.";
    form.hidden = true;
    ctaEl.hidden = false;
  }

  function setInvalidLinkState(message) {
    iconEl.innerHTML = '<svg class="icon icon-lg" aria-hidden="true"><use href="#icon-close"></use></svg>';
    iconEl.style.background = "var(--color-danger)";
    headingEl.textContent = "Link ungültig";
    messageEl.textContent = message;
    form.hidden = true;
    ctaEl.hidden = false;
    ctaEl.textContent = "Zur Startseite ";
    ctaEl.insertAdjacentHTML("beforeend", '<svg class="icon icon-sm" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>');
    ctaEl.href = "index.html";
  }

  if (!email || !token) {
    setInvalidLinkState("Diesem Link fehlen wichtige Informationen. Bitte fordere über „Passwort vergessen?“ bei der Anmeldung einen neuen Link an.");
    return;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    const password = document.getElementById("reset-password").value;
    const passwordConfirm = document.getElementById("reset-password-confirm").value;
    if (password.length < 6) {
      errorEl.textContent = "Das Passwort muss mindestens 6 Zeichen lang sein.";
      return;
    }
    if (password !== passwordConfirm) {
      errorEl.textContent = "Die Passwörter stimmen nicht überein.";
      return;
    }
    const submitBtn = document.getElementById("reset-submit");
    submitBtn.disabled = true;
    try {
      await Auth.ready;
      const result = await Auth.resetPassword({ email, token, password });
      setSuccessState(result.user ? result.user.name : "");
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
