<main id="main">
  <div class="container track-main">
    <h1><svg class="icon" aria-hidden="true" style="vertical-align:-4px;margin-right:8px;"><use href="#icon-receipt"></use></svg>Gastbestellung verfolgen</h1>
    <p>Hast du ohne Konto bestellt? Gib deine Bestellnummer (z. B. NS-AB12CD) und die bei der Bestellung verwendete E-Mail-Adresse ein, um den Status abzurufen.</p>

    <form id="track-form" class="auth-form" novalidate>
      <label for="track-order-number">Bestellnummer
        <input type="text" id="track-order-number" name="orderNumber" required placeholder="NS-AB12CD" autocomplete="off">
      </label>
      <label for="track-email">E-Mail-Adresse
        <input type="email" id="track-email" name="email" required placeholder="deine@email.de" autocomplete="email">
      </label>
      <p class="form-error" id="track-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-search"></use></svg>
        Bestellung suchen
      </button>
    </form>

    <div id="track-result" hidden></div>
  </div>
</main>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/account.js"></script>
<script src="js/scroll-nav.js"></script>
<script src="js/cookie-consent.js"></script>
<script>
(function () {
  "use strict";
  const form = document.getElementById("track-form");
  const errorEl = document.getElementById("track-error");
  const resultEl = document.getElementById("track-result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    resultEl.hidden = true;
    const orderNumber = document.getElementById("track-order-number").value.trim();
    const email = document.getElementById("track-email").value.trim();
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const res = await fetch(`/api/orders/guest?orderNumber=${encodeURIComponent(orderNumber)}&email=${encodeURIComponent(email)}`);
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || "Bestellung konnte nicht gefunden werden.";
        return;
      }
      const order = data.order;
      const date = new Date(order.date).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
      const itemsHtml = order.items.map((it) => `<div class="checkout-summary__row"><span>${it.qty}× ${escapeHtml(it.name)}</span><span>${formatPrice(it.price * it.qty)}</span></div>`).join("");
      resultEl.innerHTML = `
        <div class="order-card">
          <div class="order-card__top">
            <span class="order-card__id">${order.orderNumber}</span>
            <span class="order-card__date">${date}</span>
          </div>
          <div class="checkout-summary">${itemsHtml}</div>
          <div class="order-card__bottom">
            <span class="order-card__total">${formatPrice(order.total)}</span>
            <span class="status-badge" data-status="${order.status}">${order.status}</span>
          </div>
        </div>`;
      resultEl.hidden = false;
    } catch (err) {
      errorEl.textContent = "Bestellung konnte nicht gefunden werden.";
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
