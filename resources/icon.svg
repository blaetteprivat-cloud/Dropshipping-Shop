<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7a52"/>
      <stop offset="1" stop-color="#c2a06c"/>
    </linearGradient>
  </defs>
  <!-- Voll ausgefülltes Quadrat ohne abgerundete Ecken/Transparenz: Apple/Google-Tooling
       (Xcode-Assetkatalog, Adaptive Icons, @capacitor/assets) legt die Maskierung pro
       Plattform selbst an — ein bereits maskiertes 1024x1024-Master-Icon würde doppelt
       maskiert bzw. mit sichtbaren Rändern ausgeliefert. -->
  <rect width="1024" height="1024" fill="url(#g)"/>
  <text x="512" y="695" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="640" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
</svg>
