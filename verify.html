<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Mail bestätigen — NovaShop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239c7a52'/%3E%3Cstop offset='1' stop-color='%23c2a06c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ctext x='12' y='16.5' font-family='sans-serif' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3,7 12,13 21,7"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="5,13 10,18 19,7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13,6 19,12 13,18"/></symbol>
    <symbol id="icon-shield-check" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5l8-3z"/><polyline points="8.5,12 11,14.5 15.5,9.5"/></symbol>
  </defs>
</svg>

<header class="navbar">
  <div class="container navbar__inner">
    <a class="brand" href="index.html" aria-label="NovaShop Startseite">
      <span class="brand__mark" aria-hidden="true">N</span>
      NovaShop
    </a>
    <div class="navbar__actions">
      <a class="btn btn-ghost" href="index.html">Zur Website</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="admin-login">
    <div class="container">
      <div class="admin-login__card glass-strong">
        <div class="admin-login__icon" id="verify-icon">
          <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-mail"></use></svg>
        </div>
        <h1 id="verify-heading">E-Mail wird bestätigt …</h1>
        <p class="auth-form__sub" id="verify-message">Einen Moment bitte.</p>
        <a class="btn btn-primary btn-block" id="verify-cta" href="shop.html">
          Weiter einkaufen
          <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
        </a>
      </div>
    </div>
  </section>
</main>

<script src="js/auth.js"></script>
<script src="js/cookie-consent.js"></script>
<script>
(function () {
  "use strict";
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email") || "";
  const token = params.get("token") || "";

  const iconEl = document.getElementById("verify-icon");
  const headingEl = document.getElementById("verify-heading");
  const messageEl = document.getElementById("verify-message");
  const ctaEl = document.getElementById("verify-cta");

  function setState({ icon, tone, heading, message, ctaText, ctaHref }) {
    iconEl.innerHTML = `<svg class="icon icon-lg" aria-hidden="true"><use href="#${icon}"></use></svg>`;
    iconEl.style.background = tone === "error" ? "var(--color-danger)" : "var(--gradient-primary)";
    headingEl.textContent = heading;
    messageEl.textContent = message;
    ctaEl.lastElementChild.remove();
    ctaEl.textContent = ctaText + " ";
    ctaEl.insertAdjacentHTML("beforeend", '<svg class="icon icon-sm" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>');
    ctaEl.href = ctaHref;
  }

  if (!email || !token) {
    setState({
      icon: "icon-close",
      tone: "error",
      heading: "Ungültiger Bestätigungslink",
      message: "Diesem Link fehlen wichtige Informationen. Bitte fordere einen neuen Bestätigungslink über die Anmeldung an.",
      ctaText: "Zur Startseite",
      ctaHref: "index.html",
    });
  } else {
    try {
      const result = Auth.verifyEmail(email, token);
      if (result.alreadyVerified) {
        setState({
          icon: "icon-shield-check",
          tone: "success",
          heading: "Bereits bestätigt",
          message: "Diese E-Mail-Adresse wurde bereits bestätigt. Du bist jetzt angemeldet.",
          ctaText: "Weiter einkaufen",
          ctaHref: "shop.html",
        });
      } else {
        setState({
          icon: "icon-check",
          tone: "success",
          heading: "E-Mail bestätigt!",
          message: "Willkommen bei NovaShop, " + result.user.name + "! Dein Konto ist jetzt aktiv und du bist angemeldet.",
          ctaText: "Weiter einkaufen",
          ctaHref: "shop.html",
        });
      }
    } catch (err) {
      setState({
        icon: "icon-close",
        tone: "error",
        heading: "Bestätigung fehlgeschlagen",
        message: err.message,
        ctaText: "Zur Startseite",
        ctaHref: "index.html",
      });
    }
  }
})();
</script>
</body>
</html>
